name: Feature request
description: Suggest a new capability for HiFiBerryOS
labels: ["feature request"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - WebUI
        - Players / streaming services
        - Audio routing
        - Network
        - DSP
        - Installation / upgrade
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
