# HiFiBerry Output Mode Filter
# Creates a filter-chain module that can be controlled for channel mapping

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.name = "hifiberry-output-mode-filter"
            node.description = "HiFiBerry Output Mode Filter"
            media.name = "HiFiBerry Output Mode"
            filter.graph = {
                nodes = [
                    {
                        type = builtin
                        label = copy
                        name = output_mode
                        config = {
                            copy.inputs = 2
                            copy.outputs = 2
                            copy.matrix = [ 1.0 0.0 0.0 1.0 ]
                        }
                    }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                media.class = Audio/Sink
                node.description = "HiFiBerry Output Mode"
            }
            playback.props = {
                stream.dont-remix = true
                node.target = "alsa_output"
                node.autoconnect = true
            }
        }
    }
]
