# HiFiBerry 16-Band Biquad EQ Configuration
# Automatically inserts 16-band parametric EQ into the default output pipeline
# Uses WirePlumber smart filters to insert into the correct chain

monitor.alsa.rules = [
    # Add 16-band EQ filter chain to ALSA sinks
    {
        matches = [
            {
                node.name = "~alsa_output.*"
            }
        ]
        actions = {
            create-object = {
                factory = adapter
                args = {
                    factory.name = "libpipewire-module-filter-chain"
                    node.name = "hifiberry-eq-filter"
                    node.description = "HiFiBerry 16-Band EQ"
                    media.name = "HiFiBerry 16-Band EQ"
                    audio.channels = 2
                    audio.position = [ FL FR ]
                    node.target = "%f"
                    node.passive = true
                    filter.graph = {
                        nodes = [
                            { type = builtin, name = bq01, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq02, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq03, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq04, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq05, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq06, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq07, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq08, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq09, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq10, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq11, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq12, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq13, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq14, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq15, label = biquad, config = { biquad.type = "none" } }
                            { type = builtin, name = bq16, label = biquad, config = { biquad.type = "none" } }
                        ]
                        links = [
                            { output = "bq01:Out" input = "bq02:In" }
                            { output = "bq02:Out" input = "bq03:In" }
                            { output = "bq03:Out" input = "bq04:In" }
                            { output = "bq04:Out" input = "bq05:In" }
                            { output = "bq05:Out" input = "bq06:In" }
                            { output = "bq06:Out" input = "bq07:In" }
                            { output = "bq07:Out" input = "bq08:In" }
                            { output = "bq08:Out" input = "bq09:In" }
                            { output = "bq09:Out" input = "bq10:In" }
                            { output = "bq10:Out" input = "bq11:In" }
                            { output = "bq11:Out" input = "bq12:In" }
                            { output = "bq12:Out" input = "bq13:In" }
                            { output = "bq13:Out" input = "bq14:In" }
                            { output = "bq14:Out" input = "bq15:In" }
                            { output = "bq15:Out" input = "bq16:In" }
                        ]
                    }
                    capture.props = {
                        media.class = "Audio/Sink"
                        node.autoconnect = true
                        node.description = "HiFiBerry EQ"
                    }
                    playback.props = {
                        node.autoconnect = true
                    }
                }
            }
        }
    }
]
