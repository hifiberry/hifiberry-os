nodes = [
  {
    type    = builtin
    name    = balancer
    label   = matrix
    control = {
      Balance = -1.0   # default full left (-1.0), 0.0=center, 1.0=full right
    }
    params = {
      # 2x2 matrix: [ [Lout_Lin, Lout_Rin], [Rout_Lin, Rout_Rin] ]
      # We'll use expressions depending on Balance
      M00 = "(1.0 - max(0.0, Balance))"   # Left out from Left in
      M01 = "0.0"                         # Left out from Right in
      M10 = "0.0"                         # Right out from Left in
      M11 = "(1.0 - max(0.0, -Balance))"  # Right out from Right in
    }
  }
]

links = [
  { output = "input:out", input = "balancer:In" }
  { output = "balancer:Out", input = "output:in" }
]
