### RIAA Playback filter (96 kHz)
# RIAA equalization curve for vinyl playback
# Input: riaa_input (virtual sink)
# Output: riaa_output (passive node)
#
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "RIAA Playback (96 kHz)"
      media.name       = "RIAA Playback"

      filter.graph = {
        nodes = [
          # input fanout
          { type = builtin label = copy name = inL }
          { type = builtin label = copy name = inR }

          # Left channel
          { type = builtin label = bq_highpass name = sub_L control = { freq = 20.0 q = 0.70710678 } }
          { type = builtin label = bq_peaking  name = riaa_L1 control = { freq = 500.0 q = 0.5 gain = 13.7 } }
          { type = builtin label = bq_highshelf name = riaa_L2 control = { freq = 2122.0 q = 0.707 gain = -13.7 } }

          # Right channel
          { type = builtin label = bq_highpass name = sub_R control = { freq = 20.0 q = 0.70710678 } }
          { type = builtin label = bq_peaking  name = riaa_R1 control = { freq = 500.0 q = 0.5 gain = 13.7 } }
          { type = builtin label = bq_highshelf name = riaa_R2 control = { freq = 2122.0 q = 0.707 gain = -13.7 } }
        ]

        links = [
          { output = "inL:Out" input = "sub_L:In" }
          { output = "sub_L:Out" input = "riaa_L1:In" }
          { output = "riaa_L1:Out" input = "riaa_L2:In" }

          { output = "inR:Out" input = "sub_R:In" }
          { output = "sub_R:Out" input = "riaa_R1:In" }
          { output = "riaa_R1:Out" input = "riaa_R2:In" }
        ]

        inputs  = [ "inL:In" "inR:In" ]
        outputs = [ "riaa_L2:Out" "riaa_R2:Out" ]
      }

      audio.rate     = 96000
      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name = "riaa_input"
        media.class = Audio/Sink
        node.virtual = true
        filter.smart = false
        node.autoconnect = false
      }

      playback.props = {
        node.name = "riaa_output"
        node.passive = true
      }
    }
  }
]
