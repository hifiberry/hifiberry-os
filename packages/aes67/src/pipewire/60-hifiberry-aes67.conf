# AES67 receive support for HiFiBerryOS.
#
# Loaded into the MAIN PipeWire daemon deliberately. Upstream ships
# pipewire-aes67.conf for a separate daemon because its PTP driver node needs
# its own node group; this design uses no PTP, so that reason does not apply.
# It also matters for audio quality: a second daemon only gets RT scheduling if
# it is launched with it, and without RT it produces xruns that no amount of
# buffering fixes (measured: 12 source / 8 DAC xruns per 35 min in a non-RT
# second daemon, versus 2 / 1 here -- the latter matching a no-AES67 control).
#
# Each SAP-announced stream becomes an Audio/Source node. Those nodes are inert
# until something links to them -- no multicast join, no CPU -- so discovering
# every stream on the network is free.
#
# Edit local.ifname and sess.latency.msec here; both require a PipeWire restart.
context.modules = [
    { name = libpipewire-module-rtp-sap
        args = {
            # AES67 over Wi-Fi is not viable. Keep this on wired ethernet.
            local.ifname = eth0
            sap.ip = 239.255.255.255
            sap.port = 9875
            net.ttl = 32
            net.loop = false
            stream.rules = [
                {
                    matches = [ { rtp.session = "~.*" } ]
                    actions = {
                        create-stream = {
                            node.virtual = false
                            media.class = "Audio/Source"
                            device.api = aes67
                            # Measured floor over a 35-minute soak; matches a
                            # no-AES67 control run. 2ms underruns badly.
                            sess.latency.msec = 3
                        }
                    }
                }
            ]
        }
    }
]
